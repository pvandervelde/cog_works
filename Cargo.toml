[workspace]
resolver = "2"
members = [
    "crates/pipeline",
    "crates/nodes",
    "crates/github",
    "crates/llm",
    "crates/extension-api",
    "crates/listener",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/pvandervelde/cog_works"

# ---------------------------------------------------------------------------
# Workspace-level dependencies — pin versions here so all crates stay in sync.
# ---------------------------------------------------------------------------
[workspace.dependencies]

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Observability — structured spans/events + OpenTelemetry exporter
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["tonic"] }
tracing-opentelemetry = "0.28"

# Constant-time comparison (used by listener for HMAC-SHA256 webhook verification)
# Required to prevent timing-oracle attacks when comparing HMAC digests.
subtle = "2"

# HTTP client (used by llm and extension-api over HTTP transport)
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls",
], default-features = false }

# Async trait support (required for dyn-compatible async traits)
async-trait = "0.1"

# GitHub SDK (pvandervelde/github-bot-sdk)
github-bot-sdk = "0.2"

# Cloud queue SDK (pvandervelde/queue-runtime)
queue-runtime = "0.2"

# Template engine (used by HandlebarsTemplateEngine in the nodes crate)
handlebars = "6"

# Internal workspace crates
pipeline = { path = "crates/pipeline" }
nodes = { path = "crates/nodes" }
github = { path = "crates/github" }
llm = { path = "crates/llm" }
extension-api = { path = "crates/extension-api" }
listener = { path = "crates/listener" }
